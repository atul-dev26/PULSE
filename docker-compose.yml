services:
  ulpf:
    build: .
    container_name: ulpf-core
    ports:
      - "8000:8000"       # HTTP API + Dashboard
      - "5514:5514/udp"   # UDP Syslog listener
    volumes:
      - ulpf-data:/app/data                   # Persistent data volume
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/ulpf.db       # Store DB inside the mounted volume
    restart: unless-stopped

volumes:
  ulpf-data:
